name: CI

# `pull_request` carries no `branches` filter: there it matches the *base*
# branch, so a stacked PR whose base is another feature branch got no CI at all —
# exactly the changes that most want checking, since nobody has seen them yet.
#
# `push` is filtered, and its filter is a different one: it matches the branch
# pushed to. Feature branches are covered by the trigger above, so naming them
# here would only run all seven jobs a second time for every push. What the
# trigger above does not cover is the commit that merging makes: it exists on no
# PR, and `06a5223` reached `develop` having never been built. Two branches green
# apart can still be red together.
#
# The same shape as `codeql.yml`, and for the same reason.
on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

# A push run and a PR run never cancel each other: one groups by ref, the other
# by number. Two merges in quick succession do, and the survivor builds the tree
# the cancelled one was working towards, so the tip of `develop` stays covered.
# The merge commit skipped over does not, and nothing branches from it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub auto-dismissed a CVSS 7.5 advisory in a sibling repo, so its alert
  # list read as clean while the advisory was live in the tree. `pnpm audit`
  # reported it throughout. This is the check that notices.
  #
  # The threshold is `high`: below that, an upstream package with no fix
  # available would hold the branch red for something not worth blocking on.
  # To accept a specific high knowingly, add `--ignore <GHSA-id>` with a
  # comment saying why — visible and reviewable, unlike a silent dismissal.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  # The release checklist asks for `version` in package.json and
  # .claude-plugin/plugin.json to be bumped together. Twice it was not: the
  # plugin manifest stayed at 0.5.1 while 0.6.0 and 0.7.0 were released, and
  # nothing noticed, because release.yml reads the version from package.json
  # alone. Strengthening the checklist wording would not have caught it. This is
  # the check that notices — reported as a failure here, though only a rule
  # requiring this check would stop a merge past it.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: package.json and plugin.json declare the same version
        run: |
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")

          # A comparison of two values goes quiet when neither is a value:
          # `node -p` prints "undefined" for a missing field and "null" for a
          # null one, and exits 0 either way, so two manifests declaring no
          # version agreed with each other and this job passed saying so. Each
          # side has to look like a version before the two are compared — a
          # shape test rather than a list of the ways it can be absent, which
          # would need extending every time a new one turns up.
          #
          # Anchored at both ends. `^` alone accepted anything trailing a valid
          # prefix, and release.yml puts this same value into a shell.
          for value in "$pkg" "$plugin"; do
            if ! [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::a manifest declares no usable version — package.json is '$pkg', .claude-plugin/plugin.json is '$plugin'."
              exit 1
            fi
          done

          if [ "$pkg" != "$plugin" ]; then
            echo "::error::version mismatch — package.json is $pkg, .claude-plugin/plugin.json is $plugin. Bump both (see the Release Checklist in CONTRIBUTING.md)."
            exit 1
          fi
          echo "both declare $pkg"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # docs.yml builds and deploys on push to main only, so a dependency change
  # that breaks vitepress reaches main before anyone sees it. Build here too.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
